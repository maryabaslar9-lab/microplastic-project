<!DOCTYPE html>
<html>
<head>
    <title>Microplastic Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #17324d;
            min-height: 100vh;

            background:
                linear-gradient(
                    to bottom,
                    #f6d99a 0%,
                    #f6d99a 35%,
                    #76cbd8 35%,
                    #299bb2 100%
                );

            text-align: center;
        }

        .container {
            max-width: 750px;
            margin: auto;
            padding: 70px 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 50px 35px;
            box-shadow: 0 15px 40px rgba(0, 70, 90, 0.25);
        }

        .sun {
            width: 85px;
            height: 85px;
            background: #f4b942;
            border-radius: 50%;
            margin: 0 auto 25px;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 15px;
            color: #174b63;
        }

        .subtitle {
            font-size: 19px;
            line-height: 1.6;
            color: #55717d;
            margin-bottom: 40px;
        }

        .button {
            display: block;
            padding: 20px;
            margin: 18px auto;
            max-width: 450px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 19px;
            font-weight: bold;
            background: #287f96;
            color: white;
            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 70, 90, 0.2);
        }

        .secondary {
            background: #f1c46b;
            color: #17324d;
        }

        .description {
            margin-top: 35px;
            font-size: 14px;
            line-height: 1.6;
            color: #66808a;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: white;
        }

        @media (max-width: 600px) {

            .container {
                padding: 35px 15px;
            }

            .card {
                padding: 35px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="sun"></div>

            <h1>Microplastic Project</h1>

            <div class="subtitle">
                Investigating the Effect of Microplastics
                on Marine Biodiversity
            </div>

            <a
                class="button"
                href="https://docs.google.com/document/d/1wfVimY0cZ6Z_vzRAKLKaTur7lWlSVby4L6LXj3smQE4/edit?usp=sharing"
                target="_blank"
            >
                READ THE DOCUMENT
            </a>

            <a
                class="button secondary"
                href="https://canva.link/cr3t43wftqqpmd7"
                target="_blank"
            >
                VIEW THE SLIDES
            </a>

            <div class="description">
                Explore the research, investigation, and findings
                of this marine biodiversity project.
            </div>

        </div>

        <div class="footer">
            Marine Biodiversity Research Project
        </div>

    </div>

</body>
</html>
